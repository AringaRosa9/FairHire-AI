name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: fairhire_test
          POSTGRES_USER: fairhire
          POSTGRES_PASSWORD: fairhire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fairhire -d fairhire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fairhire_app:fairhire_app_test@localhost:5432/fairhire_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://fairhire:fairhire_test@localhost:5432/fairhire_test
      APP_DATABASE_URL: postgresql://fairhire_app:fairhire_app_test@localhost:5432/fairhire_test
      DEV_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e python/fairhire_domain -e 'apps/api[test]'
      - run: psql postgresql://fairhire:fairhire_test@localhost:5432/fairhire_test -c "CREATE ROLE fairhire_app LOGIN PASSWORD 'fairhire_app_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
      - run: ruff check apps/api python tests
      - run: mypy apps/api/fairhire_api python/fairhire_domain/fairhire_domain
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest
      - run: python apps/api/scripts/export_openapi.py --check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install uv==0.10.6
      - run: bash scripts/generate_sbom.sh artifacts/sbom
      - run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - run: >-
          uv export --locked --all-packages --format requirements.txt
          --no-emit-workspace --output-file artifacts/python-requirements.txt
      - run: uvx pip-audit --strict --requirement artifacts/python-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom

  million-row-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e python/fairhire_domain
      - run: >-
          python tests/benchmark/benchmark_million_rows.py
          --rows 1000000
          --max-seconds 1200
          --output million-row-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: million-row-benchmark
          path: million-row-benchmark.json
