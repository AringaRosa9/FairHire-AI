<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">FairHire AI system architecture</title>
  <desc id="description">The browser connects to the Next.js web application and FastAPI API. The API uses PostgreSQL, MinIO, Redis and Celery, and exports metrics to Prometheus and Grafana.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="#f8fafc"/>
  <text x="48" y="60" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">FairHire AI architecture</text>
  <text x="48" y="91" fill="#64748b" font-family="Arial" font-size="16">Tenant-aware application flow, isolated audit execution, and operational monitoring</text>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 210 218 H 288"/>
    <path d="M 478 218 H 556"/>
    <path d="M 746 190 C 790 190, 790 146, 824 146"/>
    <path d="M 746 218 H 824"/>
    <path d="M 746 246 C 790 246, 790 290, 824 290"/>
    <path d="M 1014 290 H 1072"/>
    <path d="M 651 282 C 651 364, 720 384, 824 384"/>
    <path d="M 1014 384 H 1072"/>
    <path d="M 1152 294 C 1180 294, 1180 146, 1014 146" stroke-dasharray="8 7"/>
    <path d="M 1152 318 C 1170 318, 1170 226, 1014 226" stroke-dasharray="8 7"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial" text-anchor="middle">
    <g>
      <rect x="48" y="174" width="162" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="129" y="211" fill="#0f172a" font-size="19" font-weight="700">Browser</text>
      <text x="129" y="237" fill="#64748b" font-size="14">User workspace</text>
    </g>
    <g>
      <rect x="288" y="174" width="190" height="88" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="383" y="211" fill="#312e81" font-size="19" font-weight="700">Next.js</text>
      <text x="383" y="237" fill="#6366f1" font-size="14">Web application</text>
    </g>
    <g>
      <rect x="556" y="174" width="190" height="108" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
      <text x="651" y="215" fill="#164e63" font-size="19" font-weight="700">FastAPI</text>
      <text x="651" y="242" fill="#0891b2" font-size="14">Authorization + API</text>
      <text x="651" y="263" fill="#0891b2" font-size="13">Tenant boundary</text>
    </g>
    <g>
      <rect x="824" y="111" width="190" height="70" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
      <text x="919" y="140" fill="#14532d" font-size="18" font-weight="700">PostgreSQL</text>
      <text x="919" y="163" fill="#16a34a" font-size="13">Forced RLS</text>
    </g>
    <g>
      <rect x="824" y="191" width="190" height="70" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="919" y="220" fill="#7c2d12" font-size="18" font-weight="700">MinIO / S3</text>
      <text x="919" y="243" fill="#ea580c" font-size="13">Evidence objects</text>
    </g>
    <g>
      <rect x="824" y="271" width="190" height="70" rx="16" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
      <text x="919" y="300" fill="#7f1d1d" font-size="18" font-weight="700">Redis</text>
      <text x="919" y="323" fill="#dc2626" font-size="13">JSON job queue</text>
    </g>
    <g>
      <rect x="1072" y="271" width="80" height="70" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
      <text x="1112" y="300" fill="#581c87" font-size="16" font-weight="700">Celery</text>
      <text x="1112" y="323" fill="#9333ea" font-size="12">Worker</text>
    </g>
    <g>
      <rect x="824" y="353" width="190" height="62" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="919" y="391" fill="#1e3a8a" font-size="17" font-weight="700">Prometheus</text>
    </g>
    <g>
      <rect x="1072" y="353" width="80" height="62" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
      <text x="1112" y="391" fill="#78350f" font-size="15" font-weight="700">Grafana</text>
    </g>
  </g>
</svg>
