name: fairhire-ai

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fairhire}
      POSTGRES_USER: ${POSTGRES_USER:-fairhire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairhire_local_only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fairhire} -d ${POSTGRES_DB:-fairhire}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/001-app-role.sql:ro

  redis:
    image: redis:8.2.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fairhire}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fairhire_local_only}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - minio-data:/data

  minio-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    command: ["python", "scripts/init_object_store.py"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9100}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./python:/workspace/python
      - ./packages/api-client:/workspace/packages/api-client
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn fairhire_api.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/workspace/apps/worker
      - ./python:/workspace/python
    command:
      [
        "celery",
        "-A",
        "fairhire_worker.app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/v1
      API_INTERNAL_URL: http://api:8000/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
