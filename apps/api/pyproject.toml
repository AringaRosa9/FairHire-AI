[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fairhire-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "celery==5.6.3",
  "fastapi==0.128.8",
  "fairhire-domain==0.1.0",
  "psycopg[binary,pool]>=3.2.10,<4",
  "pydantic-settings==2.11.0",
  "PyJWT[crypto]>=2.10.1,<3",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.35.0,<1"
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<10",
  "pytest-cov>=6.2.1,<8",
  "ruff>=0.12.8,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["fairhire_api"]
