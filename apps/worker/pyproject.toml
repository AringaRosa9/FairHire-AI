[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fairhire-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0,<2",
  "celery==5.6.3",
  "fairhire-domain==0.1.0",
  "polars>=1.33.0,<2",
  "psycopg[binary]>=3.2.10,<4",
  "redis>=6.4.0,<7"
]

[tool.hatch.build.targets.wheel]
packages = ["fairhire_worker"]
