[project]
name = "fairhire-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "python/fairhire_domain"]

[tool.uv.sources]
fairhire-domain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "python/fairhire_domain/tests", "tests/benchmark", "tests/contract", "tests/security"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "apps/worker", "python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
